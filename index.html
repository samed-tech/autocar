<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCar</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">🚗 AutoCar</div>

  <input type="text" placeholder="Araç ara...">

  <button>Giriş Yap</button>

<section class="hero">
  <h1>Hayalindeki Aracı Bul</h1>
  <p>Binlerce ilan arasından istediğini seç.</p>
</section>

<section class="cars">

  <div class="card">
    <img src="https://picsum.photos/400/250" alt="">
    <h3>BMW M4</h3>
    <p>4.250.000 TL</p>
    <button>Favorilere Ekle</button>
  </div>

  <div class="card">
    <img src="https://picsum.photos/401/250" alt="">
    <h3>Mercedes C200</h3>
    <p>3.100.000 TL</p>
    <button>Favorilere Ekle</button>
  </div>

</section>

<script src="script.js"></script>

</body>
</html>
